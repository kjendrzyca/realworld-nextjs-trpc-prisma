name: Playwright Tests

on:
  push:
    branches: [main, master, starter-oct-26]
  pull_request:
    branches: [main, master, starter-oct-26]

env:
  CI: true

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and prepare local database
        run: npm ci
      - name: Verify safe setup and API runner
        run: npm run test:setup
      - name: Run lint
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Install Chromium
        run: npm run browser:install -- --with-deps
      - name: Run Playwright tests
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 30
